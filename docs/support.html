<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Connect! | Time Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    
    .container {
      text-align: center;
      background: white;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
    }
    
    .emoji {
      font-size: 80px;
      margin-bottom: 20px;
      animation: wave 1.5s ease-in-out infinite;
    }
    
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      75% { transform: rotate(-20deg); }
    }
    
    h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 16px;
    }
    
    .highlight {
      color: #667eea;
    }
    
    p {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .cta-button {
      display: inline-block;
      padding: 16px 40px;
      font-size: 1.2rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 50px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    
    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">👋</div>
    <h1>Hey there!</h1>
    <p>
      Like what you see? Got ideas? Just want to chat?
      <br><br>
      <strong class="highlight">Message Yew Mun now and let's go!</strong>
    </p>
    <a href="mailto:yewmun.yip@crick.ac.uk" class="cta-button">
      📧 Get in Touch
    </a>
    <div class="footer">
      Chemical Biology STP @ The Francis Crick Institute
    </div>
  </div>
</body>
</html>
