name: Build Windows Companion

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyside6 requests pillow
      
      - name: Build executable
        run: |
          pyinstaller --clean --noconfirm `
            --name TimeTrackerCompanion `
            --onefile `
            --windowed `
            --icon robot-rainbow.png `
            --add-data "robot-rainbow.png;." `
            windows_companion/main.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTrackerCompanion-Windows
          path: dist/TimeTrackerCompanion.exe
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/TimeTrackerCompanion.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
