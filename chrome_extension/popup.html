<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      padding: 16px;
      background: #fff;
    }
    
    h1 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #333;
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    
    .time-row {
      display: flex;
      gap: 12px;
    }
    
    .time-row .form-group {
      flex: 1;
    }
    
    .error {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    
    .error.show {
      display: block;
    }
    
    .success {
      color: #27ae60;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    
    .success.show {
      display: block;
    }
    
    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn-primary {
      background: #0078d4;
      color: white;
    }
    
    .btn-primary:hover {
      background: #106ebe;
    }
    
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .status {
      font-size: 11px;
      color: #666;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
    
    .status-dot.connected {
      background: #27ae60;
    }
    
    .status-dot.disconnected {
      background: #e74c3c;
    }
    
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Log Time</h1>
  
  <div class="form-group">
    <label for="task">Task Description</label>
    <textarea id="task" placeholder="What have you been working on?"></textarea>
  </div>
  
  <div class="form-group">
    <label for="group">Research Group</label>
    <select id="group">
      <option value="">Loading groups...</option>
    </select>
  </div>
  
  <div class="time-row">
    <div class="form-group">
      <label for="startTime">Start Time</label>
      <input type="time" id="startTime">
    </div>
    <div class="form-group">
      <label for="endTime">End Time</label>
      <input type="time" id="endTime">
    </div>
  </div>
  
  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
  
  <div class="buttons">
    <button class="btn-secondary" id="settingsBtn">Settings</button>
    <button class="btn-primary" id="submitBtn">Submit</button>
  </div>
  
  <div class="status">
    <span>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </span>
    <a href="#" id="webLink" style="color: #0078d4; text-decoration: none;">Open Web UI</a>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
