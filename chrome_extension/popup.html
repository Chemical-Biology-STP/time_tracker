<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      width: 450px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: #fff;
    }
    
    .tabs {
      display: flex;
      border-bottom: 1px solid #eee;
    }
    
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: #666;
    }
    
    .tab.active {
      color: #0078d4;
      border-bottom-color: #0078d4;
    }
    
    .tab:hover {
      background: #f5f5f5;
    }
    
    .panel {
      display: none;
      padding: 16px;
    }
    
    .panel.active {
      display: block;
    }
    
    h2 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #333;
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    
    .time-row {
      display: flex;
      gap: 12px;
    }
    
    .time-row .form-group {
      flex: 1;
    }
    
    .message {
      font-size: 12px;
      margin-top: 8px;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }
    
    .message.error {
      display: block;
      background: #fee;
      color: #c00;
    }
    
    .message.success {
      display: block;
      background: #efe;
      color: #060;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn-primary {
      background: #0078d4;
      color: white;
    }
    
    .btn-primary:hover {
      background: #106ebe;
    }
    
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    
    /* Entries list */
    .entries-list {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .entry-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    
    .entry-item:last-child {
      border-bottom: none;
    }
    
    .entry-date {
      font-size: 11px;
      color: #888;
    }
    
    .entry-task {
      margin: 4px 0;
    }
    
    .entry-meta {
      font-size: 12px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
    
    .entry-hours {
      font-weight: 600;
      color: #0078d4;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }
    
    /* Summary */
    .summary-card {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .summary-value {
      font-size: 32px;
      font-weight: 600;
      color: #0078d4;
    }
    
    .summary-label {
      font-size: 12px;
      color: #666;
    }
    
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    .filter-row select {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-panel="log">Log Time</div>
    <div class="tab" data-panel="entries">Entries</div>
    <div class="tab" data-panel="summary">Summary</div>
  </div>
  
  <!-- Log Time Panel -->
  <div class="panel active" id="log">
    <div class="form-group">
      <label for="task">What have you been working on?</label>
      <textarea id="task" placeholder="Enter task description..."></textarea>
    </div>
    
    <div class="form-group">
      <label for="group">Research Group</label>
      <select id="group">
        <option value="">Select a group</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="entryDate">Date</label>
      <input type="date" id="entryDate">
    </div>
    
    <div class="time-row">
      <div class="form-group">
        <label for="startTime">Start</label>
        <input type="time" id="startTime">
      </div>
      <div class="form-group">
        <label for="endTime">End</label>
        <input type="time" id="endTime">
      </div>
    </div>
    
    <div class="message" id="logMessage"></div>
    
    <div class="buttons">
      <button class="btn-secondary" id="settingsBtn">⚙️ Settings</button>
      <button class="btn-primary" id="submitBtn">Submit</button>
    </div>
  </div>
  
  <!-- Entries Panel -->
  <div class="panel" id="entries">
    <div class="filter-row">
      <select id="entriesGroupFilter">
        <option value="">All Groups</option>
      </select>
      <select id="entriesYearFilter">
        <option value="">All Years</option>
      </select>
      <select id="entriesMonthFilter">
        <option value="">All Months</option>
      </select>
      <button class="btn-secondary" id="exportBtn">📥 CSV</button>
    </div>
    
    <div class="entries-list" id="entriesList">
      <div class="empty-state">No entries yet</div>
    </div>
  </div>
  
  <!-- Summary Panel -->
  <div class="panel" id="summary">
    <div class="filter-row">
      <select id="summaryGroupFilter">
        <option value="">All Groups</option>
      </select>
      <select id="summaryYearFilter">
        <option value="">All Years</option>
      </select>
      <select id="summaryMonthFilter">
        <option value="">All Months</option>
      </select>
    </div>
    
    <div class="summary-card">
      <div class="summary-value" id="totalHours">0</div>
      <div class="summary-label">Total Hours</div>
    </div>
    
    <div class="summary-card">
      <div class="summary-value" id="totalPay">$0</div>
      <div class="summary-label">Total Pay</div>
    </div>
    
    <div class="summary-card">
      <div class="summary-value" id="totalEntries">0</div>
      <div class="summary-label">Total Entries</div>
    </div>
  </div>
  
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
